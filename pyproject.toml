[project]
name = "viral-shorts-factory"
version = "0.1.0"
description = "Local-first AI-agent orchestration for short-form video production"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.scripts]
vsf = "viral_shorts_factory.cli.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ARG"]
ignore = ["B008"]  # Typer uses callables as defaults (Annotated style)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "ARG001"]  # asserts, tmp dirs, unused handler args are idiomatic in tests

[tool.mypy]
python_version = "3.11"
strict = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
